<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>归火石室 · 实时动作 v2</title><link rel="stylesheet" href="style.css"></head><body><main><div class="play-shell"><header><div><small>24 / 原创有限动作冒险</small><h1>归火石室 <span>v2</span></h1></div><div class="quick-actions"><button id="pause">继续</button><button id="retry">重试本房</button></div><nav><a href="../../../../games/ruins/">保留版 v1</a><a href="../../../../">游戏集</a></nav></header><section class="top"><strong id="objective">载入石室…</strong><div id="stats"></div></section><div class="field-slot"><canvas id="game" tabindex="0" width="960" height="576" aria-label="归火石室游戏画面"></canvas></div><p id="notice" role="status"></p><section class="touch" aria-label="触屏操作"><div class="dpad"><button data-hold="up">↑</button><button data-hold="left">←</button><button data-hold="down">↓</button><button data-hold="right">→</button></div><div class="actions"><button data-action="attack">J 横扫</button><button data-action="dodge">K 闪避</button><button data-action="echo">L 回声</button><button data-action="interact">E 交互</button></div></section></div><section class="notes"><div class="toolbar"><button id="next" hidden>下一关</button><button id="help">操作说明</button><select id="level" aria-label="选择关卡"><option value="0">1 苔灯庭</option><option value="1">2 回声廊</option><option value="2">3 归火殿</option></select><button id="restart">重开本关</button></div><section id="helpbox" hidden><p>WASD / 方向键持续移动 · J 横扫 · K 闪避 · L 回声灯 · E 交互。门、物件需靠近按 E。</p><p>金色区域是敌人即将打中的范围，红色是攻击。先横向离开预警，再抓恢复空隙反击。第三关守卫恢复时用回声灯破防，再靠近横扫。</p><p>回声可穿铜栅栏，不能穿石墙。失焦与刷新后暂停。自动保存完整进度；重试回到当前房间入口检查点并恢复生命。三关可独立选择。</p></section><footer>三段旅程 · 九间石室 · 原创四向关键姿态美术。动作采用有限关键姿态切换，并非完整逐帧动画。<a href="SOURCES.md">设计与来源</a></footer></section></main><script type="module" src="game.mjs"></script></body></html>
