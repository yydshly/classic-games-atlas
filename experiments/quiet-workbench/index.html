<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>别吵醒修理师 · 隔离候选</title><link rel="stylesheet" href="style.css"></head><body>
<header><a href="../../index.html">← 图鉴</a><b>别吵醒修理师 <small>单房间候选 · 未验收</small></b><button id="pause">暂停</button></header>
<main><canvas id="stage" tabindex="0" aria-label="工作台场景：方向键滚动，Shift制动；不能跳跃。"></canvas><section class="hud"><h1 id="objective">回到桌子另一头的充电座。</h1><label for="sleep">修理师 <span id="sleep-text">呼吸平稳</span></label><meter id="sleep" min="0" max="1" low=".3" high=".7" optimum="0" value="0"></meter></section><p id="status" role="status">金属怕撞，软垫怕急转。</p>
<section id="overlay"><article><p class="tag">零件盘外 · 夜里的工作台</p><h2 id="overlay-title">别吵醒修理师。</h2><p id="overlay-copy">你滚出了零件盘，想回到对面的充电座。他就在旁边睡着。走较宽的金属工具区，还是绕较窄的软垫桌沿？</p><p>方向键 / WASD 滚动 · Shift 慢行与制动。没有跳跃，也没有倒计时。入口右边是金属边，左后方有软垫角，可以先试一次轻碰。</p><button id="start" disabled>轻轻出发</button><button id="reload" hidden>重新加载</button><small>默认无声：碰撞、修理师反应与文字是完整反馈。云端模型原型，画面与真人手感未验。</small></article></section>
<div class="touch" aria-label="移动控件"><button data-key="KeyA" aria-label="向左">←</button><button data-key="KeyW" aria-label="向前">↑</button><button data-key="KeyS" aria-label="向后">↓</button><button data-key="KeyD" aria-label="向右">→</button><button data-key="ShiftLeft">制动</button></div></main>
<footer><span>隔离候选，不计入45款；没有存档或声音请求。</span><button id="retry">回入口重新试</button></footer><script>const quietEntry={title:document.querySelector("#overlay-title").textContent,copy:document.querySelector("#overlay-copy").textContent};window.quietBootReady=()=>{document.querySelector("#overlay-title").textContent=quietEntry.title;document.querySelector("#overlay-copy").textContent=quietEntry.copy;document.querySelector("#start").hidden=false;document.querySelector("#reload").hidden=true;};window.quietBootError=()=>{document.querySelector("#overlay-title").textContent="工作台暂时没有打开。";document.querySelector("#overlay-copy").textContent="请重新加载。此候选需要WebGL2，尚未完成画面验收。";document.querySelector("#start").hidden=true;const b=document.querySelector("#reload");b.hidden=false;b.onclick=()=>location.reload();};window.quietBootTimer=setTimeout(window.quietBootError,15000);</script><script type="module" src="boot.mjs" onerror="window.quietBootError()"></script></body></html>
